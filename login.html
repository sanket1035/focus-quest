<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Quest · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body class="auth">
<div class="authwrap">
  <div class="authcard">
    <div class="logo big"><i>⚔</i><span>Focus Quest</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to see the scoreboard and log your day.</p>
    <label>Email</label><input id="email" type="email" autocomplete="username" inputmode="email">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go">Log in</button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
const $=id=>document.getElementById(id);
async function go(){
  const m=$('msg');m.className='msg';m.textContent='Checking...';
  const {error}=await FQ.login($('email').value.trim(),$('pw').value);
  if(error){m.className='msg bad';m.textContent=error.message;return}
  location.replace('index.html'+FQ.KEEP);
}
$('go').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};
if(FQ.DEMO)location.replace('index.html'+FQ.KEEP);
(async()=>{if(FQ.DEMO)return;const{data}=await supabase.createClient(FQ.C.SUPABASE_URL,FQ.C.SUPABASE_ANON_KEY).auth.getSession();if(data.session)location.replace('index.html'+FQ.KEEP)})();
</script></body></html>
